<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .card { fill: #161b22; stroke: #30363d; stroke-width: 1; rx: 8px; }
      .border-line { stroke: #21262d; stroke-width: 1; }
      .header-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 20px; font-weight: 600; fill: #f0f6fc; }
      .sub-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; fill: #8b949e; }
      .btn-green { fill: #238636; rx: 6px; }
      .btn-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 500; fill: #ffffff; text-anchor: middle; }
      .secret-name { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 14px; font-weight: 600; fill: #58a6ff; }
      .tag-badge { fill: #21262d; stroke: #30363d; stroke-width: 1; rx: 12px; }
      .tag-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 11px; fill: #7ee787; font-weight: 500; text-anchor: middle; }
      .icon-lock { fill: #8b949e; }
      .icon-del { fill: #f85149; }
      .icon-edit { fill: #8b949e; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="900" height="420" class="bg" rx="10"/>

  <!-- Navigation Bar Simulation -->
  <rect x="30" y="25" width="840" height="45" fill="#161b22" stroke="#30363d" stroke-width="1" rx="6"/>
  <text x="50" y="53" class="sub-text">Settings  /  Secrets and variables  /  <tspan fill="#f0f6fc" font-weight="600">Actions</tspan></text>

  <!-- Header Section -->
  <text x="30" y="105" class="header-text">Repository secrets</text>
  <text x="30" y="128" class="sub-text">Secrets are environment variables that are encrypted. Anyone with collaborator access to this repository can use these secrets for Actions.</text>

  <!-- New repository secret button -->
  <g transform="translate(710, 85)">
    <rect width="160" height="34" class="btn-green"/>
    <text x="80" y="22" class="btn-text">New repository secret</text>
  </g>

  <!-- Secrets Table Container -->
  <rect x="30" y="150" width="840" height="230" class="card"/>

  <!-- Table Header -->
  <rect x="31" y="151" width="838" height="42" fill="#21262d" rx="7"/>
  <text x="55" y="177" class="sub-text" font-weight="600">Name</text>
  <text x="600" y="177" class="sub-text" font-weight="600">Updated</text>

  <!-- Secret Row 1: REGISTRY_TOKEN -->
  <g transform="translate(30, 193)">
    <rect width="840" height="60" fill="transparent"/>
    
    <!-- Lock Icon -->
    <path d="M55 22 a4 4 0 0 1 4 -4 h8 a4 4 0 0 1 4 4 v4 h2 a2 2 0 0 1 2 2 v10 a2 2 0 0 1 -2 2 h-18 a2 2 0 0 1 -2 -2 v-10 a2 2 0 0 1 2 -2 h2 v-4 z m4 4 h8 v-4 a2 2 0 0 0 -2 -2 h-4 a2 2 0 0 0 -2 2 v4 z" class="icon-lock"/>
    
    <!-- Secret Name -->
    <text x="85" y="34" class="secret-name">REGISTRY_TOKEN</text>
    
    <!-- Active Status Badge -->
    <rect x="250" y="20" width="70" height="20" class="tag-badge"/>
    <text x="285" y="34" class="tag-text">Active</text>

    <!-- Scope / Info -->
    <text x="340" y="34" class="sub-text">write:packages (GHCR auth)</text>

    <!-- Updated Info -->
    <text x="600" y="34" class="sub-text">Just now</text>

    <!-- Action icons (Edit / Delete buttons) -->
    <g transform="translate(780, 20)">
      <circle cx="10" cy="10" r="14" fill="#21262d" stroke="#30363d" stroke-width="1"/>
      <text x="10" y="14" font-family="sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">✎</text>
      <circle cx="45" cy="10" r="14" fill="#21262d" stroke="#30363d" stroke-width="1"/>
      <text x="45" y="14" font-family="sans-serif" font-size="12" fill="#f85149" text-anchor="middle">🗑</text>
    </g>

    <!-- Divider line -->
    <line x1="0" y1="60" x2="840" y2="60" class="border-line"/>
  </g>

  <!-- Additional Info in Card -->
  <g transform="translate(50, 280)">
    <circle cx="12" cy="12" r="10" fill="#1f6feb" fill-opacity="0.2"/>
    <text x="12" y="16" font-family="sans-serif" font-size="12" fill="#58a6ff" text-anchor="middle" font-weight="bold">i</text>
    <text x="35" y="16" class="sub-text" fill="#c9d1d9">Token được mã hóa bằng thuật toán Libsodium sealing box trước khi lưu trữ.</text>
    <text x="35" y="38" class="sub-text" fill="#8b949e">GitHub Actions tự động mask giá trị của biến <tspan fill="#58a6ff">***</tspan> trong log thực thi để bảo mật tuyệt đối.</text>
  </g>
</svg>
